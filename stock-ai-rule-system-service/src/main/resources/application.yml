# Spring配置
spring:
  application:
    name: stock-ai-rule-system-service
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    max-http-form-post-size: 102400000
    max-swallow-size: 102400000

# 日志配置
logging:
  level:
    com.jx.tracker: debug
    org.springframework: warn

# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  type-aliases-package: com.jx.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    # 自动驼峰命名规则（camel case）映射
    mapUnderscoreToCamelCase: true
    # MyBatis 自动映射策略
    # PARTIAL：只对非嵌套 resultMap 自动映射
    autoMappingBehavior: PARTIAL
    # 更详细的日志输出 影响性能, 生产环境建议不开启
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# 项目自定义配置
jx:
  tracker:

stock-ai-rule:
  risk-warning:
    # 风险查询和手动同步默认可用；五年回填、自动调度与正式闸门仍分别保持关闭。
    enabled: ${RISK_WARNING_ENABLED:true}
    backfill-enabled: ${RISK_WARNING_BACKFILL_ENABLED:false}
    source:
      primary: ${RISK_WARNING_PRIMARY_SOURCE:aktools}
      tushare-enabled: ${RISK_WARNING_TUSHARE_ENABLED:false}
      cninfo-announcement-fallback-enabled: ${RISK_WARNING_CNINFO_ANNOUNCEMENT_FALLBACK_ENABLED:true}
    # 为空时复用 market-data.provider.ak-tools-base-url。
    ak-tools-base-url: ${RISK_WARNING_AKTOOLS_BASE_URL:}
    # 可选规范化衍生网关；历史行情、宽度、估值、跨市场与 ETF 申赎数据由该网关提供。
    derived-gateway-base-url: ${RISK_WARNING_DERIVED_GATEWAY_BASE_URL:}
    model-version: ${RISK_WARNING_MODEL_VERSION:risk-warning-v1}
    after-close-cutoff: ${RISK_WARNING_AFTER_CLOSE_CUTOFF:20:00}
    # 每批最多 50 个股票对象，默认 25；市场估值代理使用独立、可审计的稳定样本池。
    collection-chunk-size: ${RISK_WARNING_COLLECTION_CHUNK_SIZE:25}
    backfill-command:
      # 一次性内部命令默认关闭；普通 Web 启动不会自动执行 Runner。
      enabled: ${RISK_WARNING_BACKFILL_COMMAND_ENABLED:false}
      mode: ${RISK_WARNING_BACKFILL_MODE:staged}
      end-date: ${RISK_WARNING_BACKFILL_END_DATE:}
      sample-size: ${RISK_WARNING_BACKFILL_SAMPLE_SIZE:50}
      symbols: ${RISK_WARNING_BACKFILL_SYMBOLS:}
      confirmation: ${RISK_WARNING_BACKFILL_CONFIRMATION:}
      report-directory: ${RISK_WARNING_BACKFILL_REPORT_DIRECTORY:target/risk-backfill/reports}
  market-data:
    provider:
      # 可选：mock / csv / tushare。外部 token 缺失时自动降级到 fallback-type。
      type: ${MARKET_DATA_PROVIDER:aktools}
      fallback-type: ${MARKET_DATA_FALLBACK_PROVIDER:mock}
      token: ${MARKET_DATA_PROVIDER_TOKEN:${TUSHARE_TOKEN:}}
      api-url: ${MARKET_DATA_PROVIDER_API_URL:https://api.tushare.pro}
      ak-tools-base-url: ${AKTOOLS_BASE_URL:http://127.0.0.1:8090}
      connect-timeout: ${MARKET_DATA_CONNECT_TIMEOUT:5s}
      read-timeout: ${MARKET_DATA_READ_TIMEOUT:60s}
      retry-count: ${MARKET_DATA_RETRY_COUNT:3}
      minimum-stock-count: ${MARKET_DATA_MINIMUM_STOCK_COUNT:4000}
      minimum-quote-coverage: ${MARKET_DATA_MINIMUM_QUOTE_COVERAGE:0.95}
      stock-list-csv-path: ${MARKET_DATA_STOCK_LIST_CSV_PATH:}
      daily-quote-csv-path: ${MARKET_DATA_DAILY_QUOTE_CSV_PATH:}
      trade-calendar-csv-path: ${MARKET_DATA_TRADE_CALENDAR_CSV_PATH:}
  scheduler:
    # 默认禁用自动调度，避免在未显式配置前触发外部行情、AI 或回测任务。
    daily-enabled: ${DAILY_WORKFLOW_ENABLED:false}
    daily-cron: ${DAILY_WORKFLOW_CRON:0 0 18 * * MON-FRI}
    zone: Asia/Shanghai

stock:
  dashboard:
    benchmark-symbols:
      A股: 000300.SH
      港股: HSI.HK
      美股: SPX.US

ai:
  llm:
    # 未配置 base-url 或 api-key 时使用 MockLlmClient；不要在配置文件中写入真实 token。
    base-url: ${AI_LLM_BASE_URL:}
    api-key: ${AI_LLM_API_KEY:}
    model: ${AI_LLM_MODEL:gpt-4o-mini}


remote:
  authServiceAddress: "http://auth.ijianxin.com:8080"
