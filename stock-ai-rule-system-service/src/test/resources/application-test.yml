spring:
  datasource:
    druid:
      master:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:stock_ai_rule_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
        username: sa
        password:
      initialSize: 1
      minIdle: 1
      maxActive: 2
      maxWait: 1000
      connectTimeout: 1000
      socketTimeout: 1000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
